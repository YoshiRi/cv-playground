<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV Playground AR の再生</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='none' stroke='%232f6fdf' stroke-width='2'/><circle cx='8' cy='8' r='2' fill='%232f6fdf'/></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .xr { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .maps { display: flex; flex-wrap: wrap; gap: 12px; }
    .maps figure { margin: 0; }
    .maps canvas { width: min(520px, calc(100vw - 32px)); height: auto; background: #000; border-radius: 8px; }
    .xr pre { margin: 0; font-size: 12px; background: var(--chip); padding: 8px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <!-- AR の試し（xr.html）の記録を読み、同じ地図づくり（xr_pipeline.js）に流して、地図を作り直す。姿勢グラフあり・なしを並べて比べる -->
  <div class="xr">
    <h1 style="margin:0;font-size:18px">CV Playground AR の再生</h1>
    <p class="small">AR の記録（姿勢・深度・検出）を、ライブと同じ地図づくりに流して作り直す。左が姿勢グラフなし、右があり（ピンク = サブマップ、緑の線 = ループ閉じ）。</p>
    <div class="row wrap">
      <label class="field">サーバーの記録 <select id="list"></select></label>
      <label class="ghost button">ファイルから<input type="file" id="file" accept=".gz" hidden></label>
      <label class="check"><input type="checkbox" id="dyn" checked> 動く物を地図から除く</label>
      <button type="button" class="primary" id="run">再生する</button>
    </div>
    <div class="small" id="status"></div>
    <div class="maps">
      <figure><canvas id="map0" width="900" height="900"></canvas><figcaption class="small" id="cap0"></figcaption></figure>
      <figure><canvas id="map1" width="900" height="900"></canvas><figcaption class="small" id="cap1"></figcaption></figure>
    </div>
    <pre id="stats"></pre>
  </div>
  <script type="module" src="xr_replay.js"></script>
</body>
</html>
