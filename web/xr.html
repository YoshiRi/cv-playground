<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV Playground AR（試し）</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='none' stroke='%232f6fdf' stroke-width='2'/><circle cx='8' cy='8' r='2' fill='%232f6fdf'/></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .xr { max-width: 720px; margin: 0 auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .xr pre { margin: 0; font-size: 12px; background: var(--chip); padding: 8px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
    #overlay { position: fixed; inset: 0; display: none; }
    #overlay.on { display: block; }
    #ov-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #ov-panel { position: absolute; left: 8px; right: 8px; top: 8px; color: #fff; background: rgba(0, 0, 0, .55); border-radius: 8px; padding: 6px 8px; font: 12px/1.45 system-ui, sans-serif; white-space: pre-wrap; }
    #ov-buttons { position: absolute; left: 8px; right: 8px; bottom: 16px; display: flex; gap: 8px; justify-content: center; }
    #ov-buttons button { font-size: 15px; padding: 8px 14px; }
    #ov-preview { position: absolute; right: 8px; bottom: 72px; width: 30%; border: 1px solid rgba(255, 255, 255, .6); }
  </style>
</head>
<body>
  <!-- ARCore（WebXR の immersive-ar）と検出をつなぐ試しのページ。Android の Chrome だけ（iOS の Safari には WebXR の AR が無い）。
       カメラの映像（camera-access）を読み戻して YOLO26n に渡し、枠の中の深度（depth-sensing）から物までの距離を m で出す -->
  <div class="xr">
    <h1 style="margin:0;font-size:18px">CV Playground AR（試し）</h1>
    <p class="small">ARCore（WebXR）のカメラの映像を物体検出（YOLO26n）に渡し、枠の中の深度から物までの距離を m で出す。Android の Chrome で、https のページで開く。</p>
    <button type="button" class="primary" id="start" disabled>AR を始める</button>
    <pre id="support">確かめている…</pre>
    <div id="rec" class="field" hidden>
      <div class="small" id="rec-text"></div>
      <button type="button" class="ghost" id="copy-md">Markdown の表をコピー</button>
      <pre id="rec-md" hidden></pre>
    </div>
    <p class="small muted">AR の画面では、上に状態（使えた機能・速さ）、右下に検出に渡した画像（上下が逆なら「上下反転」）が出る。「位置合わせ」はその画像を枠と同じ写し方で画面に半透明で重ね、ずれを確かめる。終わると記録を残す（普段の画面の実行履歴にも入る）。</p>
  </div>
  <div id="overlay">
    <canvas id="ov-canvas"></canvas>
    <canvas id="ov-preview"></canvas>
    <div id="ov-panel"></div>
    <div id="ov-buttons"><button type="button" class="ghost" id="flip">上下反転</button><button type="button" class="ghost" id="align">位置合わせ</button><button type="button" class="primary" id="end">終わる</button></div>
  </div>
  <script type="module" src="xr.js"></script>
</body>
</html>
